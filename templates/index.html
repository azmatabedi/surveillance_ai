  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #f3f4f6;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    h2 {
      color: #d9534f;
      margin-top: 30px;
      font-size: 28px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }

    .video-container {
      text-align: center;
      margin-bottom: 30px;
    }

  img {
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    width: 100%;
    max-width: 1000px;
    height: auto;
    border: 3px solid rgba(255, 255, 255, 0.1);

    display: block;       /* Needed for margin auto to work */
    margin: 20px auto;    /* Center horizontally */
  }


    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .card p {
      font-size: 22px;
      font-weight: bold;
    }

    .status-ok {
      color: #10b981;
    }

    /* Green */
    .status-alert {
      color: #ef4444;
    }

    /* Red */
    .toaster {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ef4444;
      color: white;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      animation: blink 1s infinite;
      z-index: 9999;
    }

    @keyframes blink {

      0%,
      50%,
      100% {
        opacity: 1;
      }

      25%,
      75% {
        opacity: 0;
      }
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding-bottom: 20px;
    }

    footer a {
      color: #3b82f6;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
